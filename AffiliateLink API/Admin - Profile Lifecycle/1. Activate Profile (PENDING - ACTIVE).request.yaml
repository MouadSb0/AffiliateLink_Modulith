$kind: http-request
name: 1. Activate Profile (PENDING -> ACTIVE)
description: Valide et active un profil (retourne 204 No Content).
url: "{{baseUrl}}/api/admin/profiles/{{publisherId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
order: 1000
