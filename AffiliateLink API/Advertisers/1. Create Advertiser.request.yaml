$kind: http-request
description: Crée un nouveau profil Advertiser avec un statut initial PENDING.
url: "{{baseUrl}}/api/advertisers"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "contact@acme.com",
      "companyName": "Acme Corporation",
      "sector": "E-commerce",
      "website": "https://www.acme.com"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id) {
              pm.collectionVariables.set('advertiserId', jsonData.id);
          }
      }
    language: text/javascript
order: 1000
